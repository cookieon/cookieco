[build]
  base    = "."
  command = "pnpm --filter @workspace/cookies-and-cookies run build"
  publish = "artifacts/cookies-and-cookies/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"
  CI = "true"

# Redireciona todas as rotas para o index.html (necessário para SPA React/Wouter)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache longo para assets com hash (imagens, js, css)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sem cache para o index.html (sempre atualizado)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
