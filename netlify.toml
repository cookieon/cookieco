[build]
  # Pasta raiz do projeto (onde está o package.json principal)
  base = "."

  # Comando de build
  command = "pnpm --filter @workspace/cookies-and-cookies run build"

  # Pasta de saída que a Netlify vai publicar
  publish = "artifacts/cookies-and-cookies/dist/public"

  # Node version
  environment = { NODE_VERSION = "20", PNPM_VERSION = "9" }

[build.environment]
  CI = "true"

# Redireciona todas as rotas para o index.html (necessário para SPA com React Router/Wouter)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança e cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
